services:
  app:
    container_name: vraland-crm
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in Portainer}
    restart: unless-stopped
    # Published for the reverse proxy on another host; a DOCKER-USER firewall rule admits only that proxy.
    ports:
      - "${APP_PORT:-3000}:3000"
    # Reap zombies and forward SIGTERM correctly to the Node process.
    init: true
    volumes:
      # Uploaded documents and images; back this volume up with the database.
      - documents:/app/.data
    networks:
      - app-net
    environment:
      - APP_PORT
      - BETTER_AUTH_SECRET
      - BETTER_AUTH_URL
      - DATABASE_URL
      - NEXT_PUBLIC_APP_URL
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - SMTP_FROM
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-net:
    external: true

volumes:
  documents:
